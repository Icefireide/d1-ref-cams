<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Referee Camera Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--text:#14171c;--muted:#5a6270;--border:#d3d8df;
  --ok:#0b7a3b;--ok-bg:#d9f3e3;--bad:#b3001b;--bad-bg:#fde0e4;
  --cam-a:#2b3342;--cam-b:#0f131a;--cam-fg:#c9d1de;--live:#e5233b;--live-fg:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116;--surface:#181c23;--text:#f1f3f6;--muted:#9aa4b2;--border:#2e3541;
    --ok:#4ade80;--ok-bg:#12351f;--bad:#ff7a8a;--bad-bg:#3d1219;
    --cam-a:#2b3342;--cam-b:#0a0d12;--cam-fg:#c9d1de;--live:#e5233b;--live-fg:#ffffff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116;--surface:#181c23;--text:#f1f3f6;--muted:#9aa4b2;--border:#2e3541;
  --ok:#4ade80;--ok-bg:#12351f;--bad:#ff7a8a;--bad-bg:#3d1219;
  --cam-a:#2b3342;--cam-b:#0a0d12;--cam-fg:#c9d1de;--live:#e5233b;--live-fg:#ffffff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.3}
.wrap{max-width:1100px;margin:0 auto;padding:10px 16px 16px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:8px;border-bottom:2px solid var(--border);margin-bottom:12px}
h1{margin:0;font-size:22px;font-weight:800}
.meta{margin-top:2px;color:var(--muted);font-size:14px}
.total{font-size:28px;font-weight:800;white-space:nowrap}
.total small{display:block;font-size:14px;font-weight:600;color:var(--muted);text-align:right}
.total.warn{color:var(--bad)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.teams{grid-template-columns:1fr}}
.team{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;min-width:0}
.team h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;font-size:18px;font-weight:800}
.team h2 span{font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{min-width:0}
.cam{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam.on{background:linear-gradient(135deg,var(--cam-a),var(--cam-b))}
.cam.on svg{width:36%;height:auto;fill:var(--cam-fg);opacity:.55}
.live{position:absolute;top:8px;left:8px;background:var(--live);color:var(--live-fg);font-size:12px;font-weight:800;letter-spacing:.08em;padding:2px 8px;border-radius:4px}
.cam.off{border:2px dashed var(--bad);background:var(--bad-bg);color:var(--bad);font-size:14px;font-weight:600}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:6px}
.ign{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.ign.none{font-weight:600;color:var(--muted);font-style:italic}
.pill{flex:none;font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad);color:var(--surface)}
footer{margin-top:12px;color:var(--muted);font-size:13px}
.cam iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.cam.off{background:var(--bad-bg);border:0}
.cam .nocam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:2px dashed var(--bad);background:var(--bad-bg);color:var(--bad);font-size:14px;font-weight:600;border-radius:8px;z-index:2}
.cam.on .nocam{display:none}
.cam .live{z-index:3;display:none}.cam.on .live{display:block}
.cam.on{background:#000}
.pick{margin:0 0 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.pick summary{cursor:pointer;padding:8px 10px;font-size:14px;font-weight:600;min-height:36px}
.picks{display:flex;flex-direction:column;padding:0 6px 6px}
.pickrow{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:15px;cursor:pointer;border-top:1px solid var(--border)}
.pickrow input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--ok)}
.pname{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:4px;border:1px solid var(--border);color:var(--muted);font-style:normal}
.tag.sub{border-color:var(--muted)}
.ign .tag{vertical-align:2px;margin-left:4px}
.empty{padding:14px;border:2px dashed var(--border);border-radius:8px;color:var(--muted);font-size:14px;font-weight:600;text-align:center}
.msg{max-width:560px;margin:80px auto;padding:0 16px;font-size:18px;font-weight:600;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
